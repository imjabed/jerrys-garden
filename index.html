<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jame Bouquets</title>
    <meta name="description" content="Discover handmade ribbon bouquets, personalized keepsakes and thoughtful gifts by Jame Bouquets in Berhampore." />
    <meta property="og:title" content="Jame Bouquets" />
    <meta property="og:description" content="Handmade ribbon flower bouquets, personalized gifts and keepsakes. Crafted with care in Berhampore." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jame Bouquets" />
    <meta property="og:image" content="https://jamebouquets.vercel.app/social-preview.svg" />
    <meta property="og:image:alt" content="Jame Bouquets — handmade ribbon bouquets and keepsakes" />
    <meta property="og:url" content="https://jamebouquets.vercel.app/" />
    <meta name="theme-color" content="#FAF7F2" />
    <!-- Self-expiring loader: no backend dependency, no externally loaded art. -->
    <style>
      #jb-boot-splash {
        position: fixed; inset: 0; z-index: 2147483640;
        display: grid; place-items: center; padding: 24px;
        text-align: center; background: #FAF7F2; color: #542E3A;
        animation: jb-boot-auto-dismiss .2s ease 2.45s forwards;
      }
      #jb-boot-splash.jb-boot-leaving {
        opacity: 0; visibility: hidden; pointer-events: none;
      }
      #jb-boot-splash .jb-boot-character {
        display: block; width: 112px; height: 112px; max-width: 35vw;
        object-fit: contain; margin: 0 auto 18px;
      }
      #jb-boot-splash .jb-boot-caption {
        margin: 0; font: 600 17px/1.4 Arial, sans-serif;
      }
      #jb-boot-splash .jb-boot-subcaption {
        max-width: 390px; margin: 11px auto 0;
        color: #826C71; font: 13px/1.65 Arial, sans-serif;
      }
      @keyframes jb-boot-auto-dismiss {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      #jb-boot-fallback {
        display: flex; min-height: 100vh; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; padding: 28px; background: #FAF7F2;
        color: #542E3A; text-align: center; font-family: Arial, sans-serif;
      }
      #jb-boot-fallback h2 { margin: 0; font-size: 21px; font-weight: 500; }
      #jb-boot-fallback p { max-width: 360px; font-size: 13px; line-height: 1.7; }
      #jb-boot-fallback a { padding: 12px 22px; background: #7D1837; color: #fff; font-size: 13px; text-decoration: none; }
      #root:not(:empty) + #jb-boot-fallback { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #jb-boot-splash { animation-duration: 1ms; }
      }
    </style>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jame Bouquets — Handmade Gifts" />
    <meta name="twitter:description" content="Handmade ribbon flower bouquets, personalized gifts and keepsakes." />
    <meta name="twitter:image" content="https://jamebouquets.vercel.app/social-preview.svg" />
    <link rel="preload" as="image" href="/loading-bouquet-girl.gif" type="image/gif" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF8F5] text-stone-800 antialiased selection:bg-rose-100 selection:text-rose-900 font-sans">
    <div id="jb-boot-splash" role="status" aria-live="polite" aria-label="Loading Jame Bouquets">
      <div>
        <img class="jb-boot-character" src="/loading-bouquet-girl.gif" width="112" height="112"
             alt="" aria-hidden="true" decoding="async" fetchpriority="high" />
        <p class="jb-boot-caption">Loading...</p>
        <p class="jb-boot-subcaption">Please give us a second, we're preparing your bouquets - Jame Bouquets</p>
      </div>
    </div>
    <noscript>
      <style>#jb-boot-splash, #jb-boot-fallback { display: none !important; }</style>
      <p style="padding:32px;text-align:center;font-family:Arial,sans-serif">JavaScript is required to browse the Jame Bouquets shop.</p>
    </noscript>
    <div id="root"></div>
    <div id="jb-boot-fallback">
      <h2>We couldn't open the shop.</h2>
      <p>Please check your internet connection or refresh the page.</p>
      <a href="/">Refresh the shop</a>
    </div>
    <!-- Emergency removal is independent of the React app and backend.
         The CSS animation is a second failsafe if scripts are delayed. -->
    <script>
      window.setTimeout(function () {
        var loader = document.getElementById('jb-boot-splash');
        if (loader) loader.remove();
      }, location.pathname.startsWith('/admin/editor') ? 0 : 2450);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
