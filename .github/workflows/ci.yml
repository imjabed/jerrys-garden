name: Validate Jame Bouquets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser test package
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.58.2
      - name: Typecheck
        run: npm run lint
      - name: Test custom order validation
        run: npm run test
      - name: Build frontend and server
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test website editor in Chromium (mock backend)
        run: npx playwright test
      - name: Upload browser screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-browser-test-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

