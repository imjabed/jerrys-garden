name: Jame Bouquets Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/jame-android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:?Android SDK is not installed}"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use existing website icon
        run: |
          if [ -f public/favicon.png ]; then
            mkdir -p android/app/src/main/res/drawable-nodpi
            cp public/favicon.png android/app/src/main/res/drawable-nodpi/brand_icon.png
            sed -i 's|@drawable/app_icon|@drawable/brand_icon|' android/app/src/main/AndroidManifest.xml
          fi
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk JameBouquets-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JameBouquets-v1.1-APK
          path: JameBouquets-v1.1.apk
          if-no-files-found: error
