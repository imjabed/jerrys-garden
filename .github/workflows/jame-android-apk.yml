name: Jame Bouquets Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/jame-android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use existing website icon
        run: |
          if [ -f public/favicon.png ]; then
            mkdir -p android/app/src/main/res/drawable-nodpi
            cp public/favicon.png android/app/src/main/res/drawable-nodpi/brand_icon.png
            sed -i 's|@drawable/app_icon|@drawable/brand_icon|' android/app/src/main/AndroidManifest.xml
          fi
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk JameBouquets.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JameBouquets-APK
          path: JameBouquets.apk
          if-no-files-found: error
